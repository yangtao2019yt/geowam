<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">GeoWAM geometry branch</title><desc id="desc">Multi-view observed RGB is encoded to S12 geometric features. Task and robot state condition separate geometry and action transformer towers. Predicted future S12 is decoded into depth and motion by frozen 4RC geometry heads. Action tower outputs an executable action chunk.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e9eee5" stroke-width=".6"/></pattern><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#6a8274" stroke-width="1.3"/></marker><linearGradient id="depth" x2="0" y2="1"><stop stop-color="#c75332"/><stop offset=".38" stop-color="#ffe65f"/><stop offset=".65" stop-color="#6ee6b8"/><stop offset="1" stop-color="#5b7dd5"/></linearGradient></defs><rect width="1200" height="540" fill="#fcfdf9"/><rect width="1200" height="540" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif" fill="#21372f"><text x="36" y="35" font-size="10" letter-spacing="2" fill="#658573">OBSERVE</text><text x="331" y="35" font-size="10" letter-spacing="2" fill="#658573">ENCODE</text><text x="598" y="35" font-size="10" letter-spacing="2" fill="#658573">MODEL GEOMETRY &amp; ACTION</text><text x="1028" y="35" font-size="10" letter-spacing="2" fill="#658573">DECODE</text>
